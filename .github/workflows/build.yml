name: Build MultiVentoyVlnk EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile MultiVentoyVlnk.exe (Static CRT + Admin Manifest)
        shell: cmd
        run: |
          cl /nologo /O2 /MT /EHsc /utf-8 MultiVentoyVlnk.cpp /Fe:MultiVentoyVlnk.exe /link /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTUAC:"level='requireAdministrator' uiAccess='false'" user32.lib gdi32.lib comdlg32.lib shell32.lib ole32.lib

      - name: Upload MultiVentoyVlnk.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiVentoyVlnk-Windows-x64
          path: MultiVentoyVlnk.exe
