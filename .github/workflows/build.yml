name: Build MultiVentoyVlnk Tiny EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile MultiVentoyVlnk.exe (Pure C + Optimize Size + Static CRT)
        shell: cmd
        run: |
          cl /nologo /O1 /Os /GL /MT /utf-8 MultiVentoyVlnk.c /Fe:MultiVentoyVlnk.exe /link /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTUAC:"level='requireAdministrator' uiAccess='false'" user32.lib gdi32.lib comdlg32.lib shell32.lib ole32.lib

      - name: Upload MultiVentoyVlnk.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiVentoyVlnk-Tiny-x64
          path: MultiVentoyVlnk.exe
